<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="35%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="metalTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="50%" stop-color="#65a30d" />
      <stop offset="100%" stop-color="#3f6212" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="40%" stop-color="rgba(255,255,255,0.05)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
    <filter id="kioskShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <ellipse cx="300" cy="740" rx="210" ry="24" fill="#0f172a" opacity="0.22" filter="blur(6px)" />

  <g filter="url(#kioskShadow)">
    <rect x="155" y="710" width="50" height="20" rx="4" fill="#1e293b" />
    <rect x="395" y="710" width="50" height="20" rx="4" fill="#1e293b" />
    <rect x="140" y="690" width="320" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2" />

    <!-- Cabinet Body -->
    <rect x="130" y="70" width="340" height="625" rx="20" fill="url(#bodyGradGreen)" stroke="#14532d" stroke-width="4" />
    <path d="M 470 90 L 470 675 L 458 685 L 458 80 Z" fill="#052e16" opacity="0.6" />

    <!-- Top Crown Header Marquee -->
    <rect x="145" y="85" width="310" height="95" rx="12" fill="#0f172a" stroke="#4ade80" stroke-width="2.5" />
    <rect x="150" y="90" width="300" height="85" rx="9" fill="#166534" opacity="0.25" />

    <!-- Gear + Drop Logo Icon in Header -->
    <g transform="translate(182, 132)">
      <circle cx="0" cy="0" r="22" fill="#22c55e" opacity="0.2" />
      <circle cx="0" cy="0" r="17" fill="#15803d" stroke="#4ade80" stroke-width="2" />
      <!-- Stylized Droplet in Gear -->
      <path d="M 0 -8 C -5 -1 -7 4 -7 7 C -7 11 -3 13 0 13 C 3 13 7 11 7 7 C 7 4 5 -1 0 -8 Z" fill="#ffffff" />
      <circle cx="0" cy="6" r="3" fill="#86efac" />
    </g>
    
    <text x="215" y="125" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="1">QUICKFILL™</text>
    <text x="216" y="146" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="11" fill="#4ade80" letter-spacing="2">DISHWASHING DISPENSER</text>
    <rect x="216" y="152" width="180" height="14" rx="7" fill="#15803d" />
    <text x="306" y="162" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="9" fill="#ffffff">₱1 = 100mL | ₱5 = 500mL | ₱10 = 1L</text>

    <!-- Center Control Panel Bezel -->
    <rect x="150" y="195" width="300" height="240" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    
    <!-- LCD Screen -->
    <rect x="170" y="210" width="170" height="65" rx="6" fill="url(#screenGrad)" stroke="#10b981" stroke-width="2" />
    <text x="180" y="235" font-family="Courier, monospace" font-weight="bold" font-size="12" fill="#34d399">QUICKFILL VENDO 2026</text>
    <text x="180" y="254" font-family="Courier, monospace" font-weight="bold" font-size="15" fill="#a7f3d0">INSERT COIN: ₱0.00</text>
    <circle cx="325" cy="225" r="4" fill="#10b981" />

    <!-- Coin Slot Acceptor Assembly -->
    <g transform="translate(360, 205)">
      <rect x="0" y="5" width="75" height="110" rx="8" fill="#1e293b" stroke="url(#metalTrim)" stroke-width="2.5" />
      <text x="37" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="bold" font-size="9" fill="#e2e8f0">COIN SLOT</text>
      <rect x="33" y="32" width="9" height="34" rx="4.5" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
      <polygon points="37.5,72 32,80 43,80" fill="#f59e0b" />
      <text x="37" y="93" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="8" fill="#4ade80">₱1 ₱5 ₱10 ₱20</text>
      <circle cx="37" cy="104" r="3" fill="#22c55e" />
    </g>

    <!-- Liquid Viewing Window / Level Indicator -->
    <g transform="translate(170, 285)">
      <rect x="0" y="5" width="170" height="135" rx="8" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
      <rect x="8" y="12" width="154" height="120" rx="4" fill="#1e293b" />
      <rect x="8" y="35" width="154" height="97" rx="2" fill="url(#liquidGrad)" />
      <line x1="12" y1="35" x2="26" y2="35" stroke="#ffffff" stroke-width="2" opacity="0.7" />
      <text x="30" y="39" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="bold">30L MAX</text>
      <line x1="12" y1="65" x2="22" y2="65" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
      <text x="26" y="69" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">20L</text>
      <line x1="12" y1="95" x2="22" y2="95" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
      <text x="26" y="99" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">10L</text>
      <line x1="12" y1="120" x2="26" y2="120" stroke="#ef4444" stroke-width="2" opacity="0.8" />
      <text x="30" y="123" font-family="Arial, sans-serif" font-size="8" fill="#ef4444" font-weight="bold">MIN</text>
      <circle cx="70" cy="80" r="4" fill="#ffffff" opacity="0.4" />
      <circle cx="110" cy="60" r="5" fill="#ffffff" opacity="0.3" />
      <polygon points="12,14 160,14 100,126 12,126" fill="url(#glassReflection)" />
    </g>

    <!-- Dispensing Button -->
    <g transform="translate(360, 335)">
      <rect x="0" y="5" width="75" height="85" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
      <circle cx="37" cy="40" r="22" fill="#16a34a" stroke="#15803d" stroke-width="3" />
      <circle cx="37" cy="40" r="16" fill="#22c55e" />
      <text x="37" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="9" fill="#ffffff">PUSH</text>
      <text x="37" y="47" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="7" fill="#dcfce7">TO FILL</text>
      <text x="37" y="75" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="bold" font-size="8" fill="#475569">START/PAUSE</text>
    </g>

    <!-- Lower Dispensing Alcove -->
    <rect x="160" y="455" width="280" height="205" rx="14" fill="#0f172a" stroke="url(#metalTrim)" stroke-width="3" />
    <rect x="170" y="465" width="260" height="185" rx="8" fill="#1e293b" />
    
    <rect x="285" y="465" width="30" height="15" fill="#94a3b8" />
    <path d="M 292 480 L 308 480 L 303 502 L 297 502 Z" fill="url(#metalTrim)" stroke="#475569" stroke-width="1.5" />
    <polygon points="270,470 330,470 380,630 220,630" fill="#4ade80" opacity="0.12" />

    <path d="M 300 508 C 297 516 293 521 293 526 C 293 531 296 534 300 534 C 304 534 307 531 307 526 C 307 521 303 516 300 508 Z" fill="#84cc16" />

    <rect x="185" y="618" width="230" height="24" rx="4" fill="url(#metalTrim)" stroke="#64748b" stroke-width="1.5" />
    <line x1="200" y1="630" x2="400" y2="630" stroke="#0f172a" stroke-width="3" stroke-dasharray="6,6" stroke-linecap="round" />

    <circle cx="435" cy="385" r="9" fill="url(#metalTrim)" stroke="#475569" stroke-width="2" />
    <circle cx="435" cy="385" r="4" fill="#1e293b" />
    <line x1="435" y1="384" x2="435" y2="389" stroke="#ffffff" stroke-width="1.5" />

    <rect x="145" y="668" width="130" height="16" rx="4" fill="#166534" />
    <text x="210" y="680" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="9" fill="#ffffff">QUICKFILL GREEN</text>
    <rect x="330" y="668" width="125" height="16" rx="4" fill="#0f172a" />
    <text x="392" y="680" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="9" fill="#4ade80">ECO CERTIFIED</text>
  </g>
</svg>

