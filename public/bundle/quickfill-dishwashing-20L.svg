    <path d="M 230 120 C 230 70 370 70 370 120 L 370 185 C 370 200 355 205 340 195 L 340 145 C 340 125 260 125 260 145 L 260 195 C 245 205 230 200 230 185 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />

