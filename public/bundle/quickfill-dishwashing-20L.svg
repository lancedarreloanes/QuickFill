        <text x="0" y="10">✓ Biodegradable &amp; Refilla Certified</text>
        <text x="0" y="24">✓ Dense Foam &amp; Quick Rinse</text>
        <text x="0" y="38">✓ Specially Calibrated for Vendo</text>
        <text x="0" y="52">✓ High Viscosity Active Formula</text>
